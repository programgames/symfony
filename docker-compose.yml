services:

    php:
        restart: unless-stopped
        build: ./docker/php
        networks:
            - web
        volumes:
            - ./:/var/www/symfony
        environment:
            DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?serverVersion=16&charset=utf8"

    nginx:
        restart: unless-stopped
        build: ./docker/nginx
        volumes:
            - ./:/var/www/symfony
            - ./docker/nginx/templates/default.conf.template:/etc/nginx/conf.d/default.conf
        networks:
            - web
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.nginx.rule=Host(`minecraft.multimod.ovh`)"
            - "traefik.http.routers.nginx.entrypoints=websecure"
            - "traefik.http.services.nginx.loadbalancer.server.port=80"
            - "traefik.http.routers.nginx.tls=true"
            - "traefik.http.routers.nginx.tls.certresolver=default"
            # /docs/ (documentation privée, ex. mediatheque.html) : réservé aux comptes Authelia 2FA
            - "traefik.http.routers.nginx-docs.rule=Host(`minecraft.multimod.ovh`) && PathPrefix(`/docs`)"
            - "traefik.http.routers.nginx-docs.entrypoints=websecure"
            - "traefik.http.routers.nginx-docs.tls=true"
            - "traefik.http.routers.nginx-docs.tls.certresolver=default"
            - "traefik.http.routers.nginx-docs.middlewares=authelia-auth@docker,noindex@file"
            - "traefik.http.routers.nginx-docs.service=nginx"
            - "traefik.http.routers.nginx.service=nginx"
            - "traefik.docker.network=web"
    db:
        restart: unless-stopped
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - web

volumes:
    db_data:

networks:
    web:
        external: true


# Tag de regroupement dans Arcane (sans effet sur les conteneurs)
x-arcane:
  tags:
    - name: docs
      color: gray
